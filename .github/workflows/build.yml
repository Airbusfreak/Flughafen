name: Build DresdenAirlines

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Minecraft 1.21.11 plugin
        run: |
          gradle clean build -PmcVersion=1.21.11 -PpluginVersion=4.0.0
          mkdir -p artifacts/1.21.11
          cp build/libs/*.jar artifacts/1.21.11/DresdenAirlines-1.21.11.jar

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Minecraft 26.3 plugin
        run: |
          gradle clean build -PmcVersion=26.3 -PpluginVersion=26.3.0
          mkdir -p artifacts/26.3
          cp build/libs/*.jar artifacts/26.3/DresdenAirlines-26.3.jar

      - name: Package version-specific Resourcepacks
        run: |
          cp -a resourcepack resourcepack-1.21.11
          cp -a resourcepack resourcepack-26.3
          cat > resourcepack-26.3/pack.mcmeta <<'EOF'
          {
            "pack": {
              "description": "DresdenAirlines 26.3 – aircraft models",
              "min_format": [97, 1],
              "max_format": [97, 1]
            }
          }
          EOF
          cd resourcepack-1.21.11 && zip -qr ../DresdenAirlines-Resourcepack-1.21.11.zip .
          cd ../resourcepack-26.3 && zip -qr ../DresdenAirlines-Resourcepack-26.3.zip .

      - name: Package Datapack
        run: cd datapack && zip -r ../DresdenAirlines-Datapack.zip .

      - name: Upload Minecraft 1.21.11 JAR
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-1.21.11
          path: artifacts/1.21.11/DresdenAirlines-1.21.11.jar

      - name: Upload Minecraft 26.3 JAR
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-26.3
          path: artifacts/26.3/DresdenAirlines-26.3.jar

      - name: Upload Resourcepack 1.21.11
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-Resourcepack-1.21.11
          path: DresdenAirlines-Resourcepack-1.21.11.zip

      - name: Upload Resourcepack 26.3
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-Resourcepack-26.3
          path: DresdenAirlines-Resourcepack-26.3.zip

      - name: Upload Datapack
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-Datapack
          path: DresdenAirlines-Datapack.zip
