name: Build DresdenAirlines

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle build

      - name: Package Resourcepack
        run: cd resourcepack && zip -r ../DresdenAirlines-Resourcepack.zip .

      - name: Package Datapack
        run: cd datapack && zip -r ../DresdenAirlines-Datapack.zip .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-JAR
          path: build/libs/*.jar

      - name: Upload Resourcepack
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-Resourcepack
          path: DresdenAirlines-Resourcepack.zip

      - name: Upload Datapack
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-Datapack
          path: DresdenAirlines-Datapack.zip
