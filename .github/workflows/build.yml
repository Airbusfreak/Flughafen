name: Build DresdenAirlines

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Minecraft 1.21.11 plugin
        run: |
          gradle clean build -PmcVersion=1.21.11 -PpluginVersion=4.0.0
          mkdir -p artifacts/1.21.11
          cp build/libs/*.jar artifacts/1.21.11/DresdenAirlines-1.21.11.jar

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Minecraft 26.2 plugin
        run: |
          gradle clean build -PmcVersion=26.2 -PpluginVersion=4.0.0-26.2
          mkdir -p artifacts/26.2
          cp build/libs/*.jar artifacts/26.2/DresdenAirlines-26.2.jar

      - name: Build Minecraft 26.3 plugin
        run: |
          gradle clean build -PmcVersion=26.3 -PpluginVersion=4.0.0-26.3
          mkdir -p artifacts/26.3
          cp build/libs/*.jar artifacts/26.3/DresdenAirlines-26.3.jar

      - name: Package version-specific Resourcepacks and Datapacks
        run: |
          set -e
          for version in 1.21.11 26.2 26.3; do
            mkdir -p "packaging/$version"
            cp -a resourcepack/. "packaging/$version/resourcepack/"
            cp -a datapack/. "packaging/$version/datapack/"
          done

          cat > packaging/1.21.11/resourcepack/pack.mcmeta <<'EOF'
          {
            "pack": {
              "pack_format": 75,
              "description": "DresdenAirlines 4.0.0 – aircraft models (1.21.11)"
            }
          }
          EOF
          cat > packaging/26.2/resourcepack/pack.mcmeta <<'EOF'
          {
            "pack": {
              "description": "DresdenAirlines – aircraft models (26.2)",
              "min_format": [88, 0],
              "max_format": [88, 0]
            }
          }
          EOF
          cat > packaging/26.3/resourcepack/pack.mcmeta <<'EOF'
          {
            "pack": {
              "description": "DresdenAirlines – aircraft models (26.3)",
              "min_format": [97, 1],
              "max_format": [97, 1]
            }
          }
          EOF
          cat > packaging/1.21.11/datapack/pack.mcmeta <<'EOF'
          {
            "pack": {
              "pack_format": 94,
              "description": "DresdenAirlines Datapack (1.21.11)"
            }
          }
          EOF
          cat > packaging/26.2/datapack/pack.mcmeta <<'EOF'
          {
            "pack": {
              "description": "DresdenAirlines Datapack (26.2)",
              "min_format": [107, 1],
              "max_format": [107, 1]
            }
          }
          EOF
          cat > packaging/26.3/datapack/pack.mcmeta <<'EOF'
          {
            "pack": {
              "description": "DresdenAirlines Datapack (26.3)",
              "min_format": [121, 0],
              "max_format": [121, 0]
            }
          }
          EOF

          for version in 1.21.11 26.2 26.3; do
            (cd "packaging/$version/resourcepack" && zip -qr "../../../DresdenAirlines-Resourcepack-$version.zip" .)
            (cd "packaging/$version/datapack" && zip -qr "../../../DresdenAirlines-Datapack-$version.zip" .)
          done

      - name: Upload Minecraft 1.21.11 JAR
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-1.21.11
          path: artifacts/1.21.11/DresdenAirlines-1.21.11.jar

      - name: Upload Minecraft 26.2 JAR
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-26.2
          path: artifacts/26.2/DresdenAirlines-26.2.jar

      - name: Upload Minecraft 26.3 JAR
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-26.3
          path: artifacts/26.3/DresdenAirlines-26.3.jar

      - name: Upload Resourcepack 1.21.11
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-Resourcepack-1.21.11
          path: DresdenAirlines-Resourcepack-1.21.11.zip

      - name: Upload Resourcepack 26.2
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-Resourcepack-26.2
          path: DresdenAirlines-Resourcepack-26.2.zip

      - name: Upload Resourcepack 26.3
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-Resourcepack-26.3
          path: DresdenAirlines-Resourcepack-26.3.zip

      - name: Upload Datapack 1.21.11
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-Datapack-1.21.11
          path: DresdenAirlines-Datapack-1.21.11.zip

      - name: Upload Datapack 26.2
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-Datapack-26.2
          path: DresdenAirlines-Datapack-26.2.zip

      - name: Upload Datapack 26.3
        uses: actions/upload-artifact@v4
        with:
          name: DresdenAirlines-Datapack-26.3
          path: DresdenAirlines-Datapack-26.3.zip
