plugins {
    id 'java'
}

group = 'de.dresdenairlines'

def mcVersion = (findProperty('mcVersion') ?: '1.21.11').toString()
def pluginVersion = (findProperty('pluginVersion') ?: '4.0.0').toString()
version = pluginVersion

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${mcVersion}-R0.1-SNAPSHOT"
}

def javaVersion = mcVersion.startsWith('26.') ? 25 : 21
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

tasks.named('jar') {
    archiveBaseName = "DresdenAirlines-${mcVersion}"
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}
