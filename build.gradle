plugins {
    id 'java'
}

group = 'de.dresdenairlines'
version = '4.0.0'

repositories { maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
dependencies { compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT' }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

processResources { filesMatching('plugin.yml') { expand(version: project.version) } }
