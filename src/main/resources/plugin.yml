name: DresdenAirlines
version: ${version}
main: de.dresdenairlines.DresdenAirlines
api-version: '${apiVersion}'
description: Multiplayer airline, airport and passenger flight simulation
author: DresdenAirlines
commands:
  airline:
    description: Manage your airline
    usage: /airline
  airport:
    description: Airport management and locator
    usage: /airport
  flight:
    description: Book passenger flights
    usage: /flight
permissions:
  dresdenairlines.admin:
    default: op
